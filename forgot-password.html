<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - GitClone</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1>GitClone</h1>
        <div class="auth-card">
            <h2>Recuperar Senha</h2>
            <p style="text-align: center; color: #586069; margin-bottom: 20px; font-size: 14px;">
                Digite seu nome de usuário ou email para receber instruções de recuperação de senha.
            </p>
            <form id="forgot-password-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="username-email">Usuário ou Email</label>
                    <input type="text" id="username-email" required>
                </div>
                <button type="submit" onclick="requestPasswordReset()">Recuperar Senha</button>
            </form>
            <p class="auth-link">
                Lembrou sua senha? <a href="signin.html">Voltar ao login</a>
            </p>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
