<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - GitClone</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1>GitClone</h1>
        <div class="auth-card">
            <h2>Redefinir Senha</h2>
            <p style="text-align: center; color: #586069; margin-bottom: 20px; font-size: 14px;">
                Digite o token de recuperação e sua nova senha.
            </p>
            <form id="reset-password-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="token">Token de Recuperação</label>
                    <input type="text" id="token" required>
                    <small style="color: #586069; font-size: 12px;">O token foi gerado na tela anterior</small>
                </div>
                <div class="form-group">
                    <label for="new-password">Nova Senha</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <button type="submit" onclick="resetPassword()">Redefinir Senha</button>
            </form>
            <p class="auth-link">
                Lembrou sua senha? <a href="signin.html">Voltar ao login</a>
            </p>
        </div>
    </div>

    <script>
        // Preencher automaticamente o token se disponível
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('resetToken');
            if (token) {
                document.getElementById('token').value = token;
            }
        });
    </script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
